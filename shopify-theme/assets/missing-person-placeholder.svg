<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Missing person appeal image</title>
  <desc id="desc">Generic image used when no case photo is available.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b0508"/>
      <stop offset="55%" stop-color="#120203"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="22%" r="60%">
      <stop offset="0%" stop-color="#ff4d4d" stop-opacity=".35"/>
      <stop offset="45%" stop-color="#ff1f1f" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" fill="url(#glow)"/>
  <circle cx="600" cy="420" r="165" fill="#2c2c2c" stroke="#ff5a5a" stroke-width="18"/>
  <path d="M320 975c38-198 174-295 280-295s242 97 280 295" fill="#242424" stroke="#ff5a5a" stroke-width="18" stroke-linecap="round"/>
  <rect x="176" y="120" width="848" height="960" rx="44" ry="44" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="6"/>
  <text x="600" y="1040" text-anchor="middle" fill="#ffe1e1" font-family="Arial, sans-serif" font-size="68" font-weight="700" letter-spacing="10">MISSING PERSON</text>
</svg>
